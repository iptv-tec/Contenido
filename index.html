<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Admin Canales</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
    body { background:#0b0f1e; font-size:16px; min-height:100vh; color:#e8edf5; overflow-x:hidden; }

    /* ===== REPRODUCTOR FLOTANTE ===== */
    #reproductorContenedor {
      position:fixed; top:0; left:0; right:0; background:#000; color:#fff; z-index:300;
      transform:translateY(-100%); transition:transform .3s ease;
    }
    #reproductorContenedor.visible { transform:translateY(0); }
    .reproductor-header { display:flex; justify-content:space-between; align-items:center; padding:.4rem 1rem; background:#111; height:38px; }
    .reproductor-header h3 { font-size:.9rem; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:85%; }
    .btn-cerrar-rep { background:transparent; border:none; color:#fff; font-size:1.3rem; cursor:pointer; }
    #reproductorContenedor .plyr { width:100%; --plyr-color-main:#1a73e8; --plyr-video-background:#000; }
    #reproductorContenedor .plyr__video-wrapper { aspect-ratio:16/9; max-height:55vw; }

    #iframeContenedor {
      position:fixed; top:0; left:0; right:0; background:#000; color:#fff; z-index:300;
      transform:translateY(-100%); transition:transform .3s ease;
    }
    #iframeContenedor.visible { transform:translateY(0); }
    #iframeWrapper { width:100%; aspect-ratio:16/9; max-height:55vw; background:#000; }
    #iframeWrapper iframe { width:100%; height:100%; border:0; display:block; }

    /* ===== BARRA SUPERIOR ===== */
    .admin-top { padding:.75rem; background:#0b0f1e; border-bottom:1px solid #1a2240; }
    .admin-botones { display:flex; gap:.5rem; margin-bottom:.6rem; }
    .btn-accion {
      flex:1; padding:.75rem .5rem; border:none; border-radius:8px; color:#fff; cursor:pointer;
      font-size:.85rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:.4rem;
    }
    .btn-descargar { background:#0f766e; }
    .btn-publicar { background:#166534; }
    .btn-accion:disabled { opacity:.5; cursor:not-allowed; }

    /* ===== SELECTOR Y CONTADOR ===== */
    .select-categoria {
      width:100%; padding:.85rem 2.6rem .85rem 1rem; background:#1a2240; color:#e8edf5;
      border:1px solid #2a3a5a; border-radius:10px; font-size:.95rem; font-weight:600; cursor:pointer;
      appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2300cc44' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat:no-repeat; background-position:right 1rem center;
    }
    .contador-canales {
      text-align:center; background:#0f1319; border:1px solid #1a2a3a; color:#00cc44;
      padding:.6rem; border-radius:22px; font-size:.9rem; font-weight:700; margin-top:.6rem;
    }

    /* ===== GRID DE CANALES ===== */
    .channels-grid { 
      display:grid; 
      grid-template-columns:repeat(3, minmax(0, 1fr)); /* Fuerza 3 columnas exactas */
      gap:.55rem; 
      padding:.75rem .75rem 6rem; 
    }
    .channel-card { 
      display:flex; flex-direction:column; align-items:center; cursor:pointer; 
      border-radius:12px; padding:.35rem; transition:transform .1s; 
    }
    .channel-card:active { transform:scale(.96); background:rgba(255,255,255,.06); }
    
    .ch-logo { 
      width:100%; aspect-ratio:1 / 1; /* Cuadrado perfecto */
      background:#fff; border-radius:12px; display:flex; align-items:center; justify-content:center; 
      overflow:hidden; border:2px solid #1a2a3a; 
    }
    .ch-logo img { width:100%; height:100%; object-fit:contain; padding:6px; }
    
    .ch-name { 
      font-size:.7rem; font-weight:600; text-align:center; margin-top:.35rem; 
      width:100%; line-height:1.2; height:2.4em; /* Altura fija para 2 líneas */
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .msg-info { text-align:center; padding:1.5rem; color:#5a7090; grid-column:1 / -1; }

    /* ===== MODALES ===== */
    .modal-fondo { position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; justify-content:center; align-items:flex-start; padding:1.2rem .75rem; z-index:500; overflow-y:auto; }
    .modal-fondo.oculto { display:none; }
    .modal-contenido { background:#131827; padding:1.5rem; border-radius:12px; width:100%; max-width:500px; border:1px solid #1a2240; }
    .modal-titulo { text-align:center; font-size:1.3rem; font-weight:700; margin-bottom:1.3rem; display:flex; align-items:center; justify-content:center; gap:.45rem; }
    .modal-titulo .modal-icon { width:30px; height:30px; border-radius:50%; background:#3b6ef5; display:inline-flex; align-items:center; justify-content:center; }
    
    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; margin-bottom:.4rem; color:#8892b0; font-weight:600; font-size:.9rem; }
    .form-group input, .form-group select { width:100%; padding:.7rem .9rem; border:1px solid #1a2240; border-radius:8px; color:#e8edf5; background:#0b0f1e; }
    
    /* Previsualización del logo */
    .logo-preview { width:90px; height:90px; margin-top:.5rem; background:#1a2240; border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .logo-preview img { max-width:100%; max-height:100%; object-fit:contain; }

    .botones-modal { display:flex; gap:.5rem; margin-top:1rem; }
    .btn-modal { flex:1; padding:.8rem; border:none; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; }
    .btn-modal-guardar { background:#166534; color:#fff; }
    .btn-modal-cerrar { background:#1e2640; color:#8892b0; }

    /* ===== MODAL OPCIONES CANAL ===== */
    .opciones-canal-header { display:flex; flex-direction:column; align-items:center; gap:.6rem; margin-bottom:1.2rem; }
    .opciones-canal-logo { width:100px; height:100px; background:#fff; border-radius:14px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .opciones-canal-logo img { max-width:88%; max-height:88%; object-fit:contain; }
    .opciones-canal-nombre { font-size:1.05rem; font-weight:700; text-align:center; word-break:break-word; }
    .opciones-botones { display:flex; flex-direction:column; gap:.5rem; }
    .opcion-btn { padding:.85rem; border:none; border-radius:8px; font-size:.95rem; font-weight:700; cursor:pointer; color:#fff; text-align:center; }
    .opcion-editar { background:#1e3a8a; }
    .opcion-borrar { background:#7f1d1d; }
    .opcion-play { background:#145214; }

    /* ===== FAB Y SPINNER ===== */
    #fabAgregarCanal { position:fixed; bottom:1.5rem; right:1.2rem; width:54px; height:54px; border-radius:50%; background:#00cc44; color:#000; border:none; font-size:1.7rem; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 24px rgba(0,204,68,.45); z-index:400; cursor:pointer; }
    .spinner { display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<!-- ===================== REPRODUCTORES ===================== -->
<div id="reproductorContenedor">
  <div class="reproductor-header">
    <h3 id="nombreCanalRep">Canal</h3>
    <button class="btn-cerrar-rep" onclick="cerrarReproductor()">✕</button>
  </div>
  <video id="reproductorStream" controls playsinline></video>
</div>

<div id="iframeContenedor">
  <div class="reproductor-header">
    <h3 id="nombreCanalIframe">Canal</h3>
    <button class="btn-cerrar-rep" onclick="cerrarIframeReproductor()">✕</button>
  </div>
  <div id="iframeWrapper"></div>
</div>

<!-- ===================== BARRA SUPERIOR ===================== -->
<div class="admin-top">
  <div class="admin-botones">
    <button class="btn-accion btn-descargar" id="btnCargar">
      <i class="fas fa-download"></i> Cargar
    </button>
    <button class="btn-accion btn-publicar" id="btnActualizar">
      <i class="fas fa-paper-plane"></i> Actualizar
    </button>
  </div>
  <select id="selectCategoriaAdmin" class="select-categoria">
    <option value="__todas__">Todas las categorías</option>
  </select>
  <div class="contador-canales" id="contadorAdmin">0 canales</div>
</div>

<!-- ===================== GRID ===================== -->
<div class="channels-grid" id="contenedorCanales">
  <p class="msg-info">Toca "Cargar" para ver los canales.</p>
</div>

<!-- ===================== FAB ===================== -->
<button id="fabAgregarCanal" onclick="abrirModalAgregar()">+</button>

<!-- ===================== MODAL AGREGAR ===================== -->
<div class="modal-fondo oculto" id="modalAgregarCanal">
  <div class="modal-contenido">
    <h2 class="modal-titulo"><span class="modal-icon" style="background:#2ecc71"><i class="fas fa-plus"></i></span> Agregar Canal</h2>
    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" id="addNombre" placeholder="Ej: ESPN">
    </div>
    <div class="form-group">
      <label>URL *</label>
      <input type="url" id="addUrl" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>Logo</label>
      <input type="url" id="addLogo" placeholder="https://...">
      <div class="logo-preview">
        <img id="previewImgAgregar" alt="Preview" src="">
      </div>
    </div>
    <div class="form-group">
      <label>Categoría *</label>
      <div style="display:flex; gap:.5rem;">
        <select id="addCategoria" style="flex:1;">
          <option value="" disabled selected>Selecciona una categoría...</option>
        </select>
        <button onclick="agregarNuevaCategoria()" style="background:#00cc44; border:none; border-radius:8px; padding:0 1rem; font-weight:bold; font-size:1.2rem; cursor:pointer;">+</button>
      </div>
    </div>
    <div class="botones-modal">
      <button class="btn-modal btn-modal-guardar" onclick="guardarNuevoCanal()">Guardar</button>
      <button class="btn-modal btn-modal-cerrar" onclick="cerrarModalAgregar()">Cancelar</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL EDITAR ===================== -->
<div class="modal-fondo oculto" id="modalEditar">
  <div class="modal-contenido">
    <h2 class="modal-titulo"><span class="modal-icon"><i class="fas fa-pencil-alt"></i></span> Editar Canal</h2>
    <div class="form-group"><label>Nombre *</label><input type="text" id="editNombre"></div>
    <div class="form-group"><label>URL *</label><input type="text" id="editUrl"></div>
    <div class="form-group">
      <label>Logo</label>
      <input type="text" id="editLogo">
      <div class="logo-preview">
        <img id="previewImgEditar" alt="Preview" src="">
      </div>
    </div>
    <div class="form-group">
      <label>Categoría *</label>
      <select id="editCategoria"></select>
    </div>
    <div class="botones-modal">
      <button class="btn-modal btn-modal-guardar" onclick="guardarEdicion()">Guardar</button>
      <button class="btn-modal btn-modal-cerrar" onclick="cerrarModalEditar()">Cancelar</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL OPCIONES ===================== -->
<div class="modal-fondo oculto" id="modalOpciones">
  <div class="modal-contenido" style="max-width:360px;">
    <div class="opciones-canal-header">
      <div class="opciones-canal-logo"><img id="opcionesLogo"></div>
      <div class="opciones-canal-nombre" id="opcionesNombre">Canal</div>
    </div>
    <div class="opciones-botones">
      <button class="opcion-btn opcion-editar" onclick="opcionEditar()"><i class="fas fa-pencil-alt"></i> Editar</button>
      <button class="opcion-btn opcion-borrar" onclick="opcionBorrar()"><i class="fas fa-trash"></i> Borrar</button>
      <button class="opcion-btn opcion-play" onclick="opcionReproducir()"><i class="fas fa-play"></i> Reproducir</button>
    </div>
    <button class="btn-modal btn-modal-cerrar" style="width:100%; margin-top:.8rem;" onclick="cerrarModalOpciones()">Cancelar</button>
  </div>
</div>

<!-- ===================== LIBRERÍAS ===================== -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.14/dist/hls.min.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>

<script>
/* ============================================================
   CONFIGURACIÓN Y TOKEN
   ============================================================ */
const GITHUB_USER = "iptv-tec";
const GITHUB_REPO = "Contenido"; 
const GITHUB_TOKEN = "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"; 

const LOGO_DEFAULT = "https://i.imgur.com/TRhRPOA.jpeg";

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
let canalesPorCategoria = {};
let ordenCategorias = [];
let categoriaSeleccionada = "__todas__";
let canalSeleccionado = null;

/* ============================================================
   CARGAR DATOS
   ============================================================ */
async function cargarDesdeGitHub() {
  const btn = document.getElementById("btnCargar");
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>...';

  try {
    const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/canales.json?t=${Date.now()}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("No se pudo leer el archivo de canales.");
    
    const data = await res.json();
    canalesPorCategoria = data.lista || {};
    ordenCategorias = data.orden || [];
    
    // Sincronizar orden por si faltan categorías en el array
    Object.keys(canalesPorCategoria).forEach(cat => {
      if (!ordenCategorias.includes(cat)) ordenCategorias.push(cat);
    });
    
    renderSelect();
    renderGrid();
    actualizarContador();
    alert("✅ Canales cargados correctamente.");
  } catch (e) {
    alert("❌ Error: " + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ============================================================
   ACTUALIZAR DATOS
   ============================================================ */
async function actualizarEnGitHub() {
  const total = Object.values(canalesPorCategoria).reduce((s, a) => s + a.length, 0);
  if (total === 0) return alert("No hay canales para actualizar.");

  if (!confirm(`Se actualizarán ${total} canales.\n\n¿Continuar?`)) return;

  const btn = document.getElementById("btnActualizar");
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>...';

  try {
    const baseApi = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;
    const headers = { Authorization: `token ${GITHUB_TOKEN}`, Accept: "application/vnd.github.v3+json" };

    let resCan = await fetch(baseApi + "canales.json", { headers });
    if (!resCan.ok) throw new Error("Error de conexión. Revisa tu token.");
    let dataCan = await resCan.json();

    const payload = { lista: canalesPorCategoria, orden: ordenCategorias };
    const contentCan = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
    let putCan = await fetch(baseApi + "canales.json", {
      method: 'PUT', headers,
      body: JSON.stringify({ message: "Actualizar canales", content: contentCan, sha: dataCan.sha })
    });
    if (!putCan.ok) throw new Error("Error al guardar los canales.");

    let resVer = await fetch(baseApi + "version.json", { headers });
    let dataVer = await resVer.json();

    const nuevaVersion = new Date().toISOString();
    const contentVer = btoa(JSON.stringify({ version: nuevaVersion }));
    let putVer = await fetch(baseApi + "version.json", {
      method: 'PUT', headers,
      body: JSON.stringify({ message: "Nueva versión", content: contentVer, sha: dataVer.sha })
    });
    if (!putVer.ok) throw new Error("Error al guardar la versión.");

    alert(`✅ ¡Actualizado correctamente!`);
  } catch (e) {
    alert("❌ Error al guardar: " + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ============================================================
   RENDERIZADO
   ============================================================ */
function renderSelect() {
  const sel = document.getElementById("selectCategoriaAdmin");
  sel.innerHTML = `<option value="__todas__">Todas las categorías</option>`;
  
  ordenCategorias.forEach(cat => {
    if(canalesPorCategoria[cat]) {
      sel.innerHTML += `<option value="${cat}">${cat}</option>`;
    }
  });
  sel.value = categoriaSeleccionada;
}

function renderGrid() {
  const cont = document.getElementById("contenedorCanales");
  cont.innerHTML = "";

  let items = [];
  if (categoriaSeleccionada === "__todas__") {
    ordenCategorias.forEach(cat => {
      if(canalesPorCategoria[cat]) {
        canalesPorCategoria[cat].forEach((c, i) => items.push({ cat, idx: i, canal: c }));
      }
    });
  } else {
    if(canalesPorCategoria[categoriaSeleccionada]) {
      canalesPorCategoria[categoriaSeleccionada].forEach((c, i) => items.push({ cat: categoriaSeleccionada, idx: i, canal: c }));
    }
  }

  if (!items.length) {
    cont.innerHTML = `<p class="msg-info">No hay canales disponibles.</p>`;
    return;
  }

  items.forEach(({ cat, idx, canal }) => {
    const card = document.createElement("div");
    card.className = "channel-card";
    card.innerHTML = `
      <div class="ch-logo"><img src="${canal.logo || LOGO_DEFAULT}" onerror="this.src='${LOGO_DEFAULT}'"></div>
      <div class="ch-name">${canal.nombre}</div>
    `;
    card.onclick = () => abrirModalOpciones(cat, idx);
    cont.appendChild(card);
  });
}

function actualizarContador() {
  let total = 0;
  if (categoriaSeleccionada === "__todas__") {
    Object.values(canalesPorCategoria).forEach(arr => total += arr.length);
  } else if (canalesPorCategoria[categoriaSeleccionada]) {
    total = canalesPorCategoria[categoriaSeleccionada].length;
  }
  document.getElementById("contadorAdmin").textContent = total === 1 ? "1 canal" : total + " canales";
}

/* ============================================================
   MODALES: AGREGAR
   ============================================================ */
function abrirModalAgregar() {
  document.getElementById("addNombre").value = "";
  document.getElementById("addUrl").value = "";
  document.getElementById("addLogo").value = "";
  document.getElementById("previewImgAgregar").src = LOGO_DEFAULT; // Logo por defecto
  
  const sel = document.getElementById("addCategoria");
  sel.innerHTML = `<option value="" disabled selected>Selecciona una categoría...</option>`;
  
  // Usamos Object.keys para asegurarnos de que salgan TODAS las categorías
  Object.keys(canalesPorCategoria).forEach(cat => {
    sel.innerHTML += `<option value="${cat}">${cat}</option>`;
  });
  
  document.getElementById("modalAgregarCanal").classList.remove("oculto");
}

function cerrarModalAgregar() {
  document.getElementById("modalAgregarCanal").classList.add("oculto");
}

function agregarNuevaCategoria() {
  const nueva = prompt("Nombre de la nueva categoría:");
  if (!nueva || !nueva.trim()) return;
  const cat = nueva.trim();
  
  if (!canalesPorCategoria[cat]) {
    canalesPorCategoria[cat] = [];
    if (!ordenCategorias.includes(cat)) ordenCategorias.push(cat);
    renderSelect();
    
    const sel = document.getElementById("addCategoria");
    sel.innerHTML += `<option value="${cat}">${cat}</option>`;
    sel.value = cat;
  } else {
    alert("Esa categoría ya existe.");
  }
}

function actualizarPreviewLogo(inputId, imgId) {
  const url = document.getElementById(inputId).value.trim();
  const img = document.getElementById(imgId);
  img.src = url || LOGO_DEFAULT;
  img.onerror = () => img.src = LOGO_DEFAULT;
}

function guardarNuevoCanal() {
  const nombre = document.getElementById("addNombre").value.trim();
  const url = document.getElementById("addUrl").value.trim();
  const logo = document.getElementById("addLogo").value.trim() || LOGO_DEFAULT;
  const cat = document.getElementById("addCategoria").value;

  if (!nombre || !url || !cat) return alert("Completa nombre, URL y categoría.");

  canalesPorCategoria[cat].push({ nombre, url, logo, categoria: cat });
  cerrarModalAgregar();
  renderGrid();
  actualizarContador();
}

/* ============================================================
   MODALES: OPCIONES
   ============================================================ */
function abrirModalOpciones(cat, idx) {
  canalSeleccionado = { cat, idx };
  const canal = canalesPorCategoria[cat][idx];

  document.getElementById("opcionesLogo").src = canal.logo || LOGO_DEFAULT;
  document.getElementById("opcionesNombre").textContent = canal.nombre;
  document.getElementById("modalOpciones").classList.remove("oculto");
}

function cerrarModalOpciones() {
  document.getElementById("modalOpciones").classList.add("oculto");
  canalSeleccionado = null;
}

function opcionBorrar() {
  if (!canalSeleccionado) return;
  if (!confirm("¿Eliminar este canal?")) return;

  canalesPorCategoria[canalSeleccionado.cat].splice(canalSeleccionado.idx, 1);
  if (canalesPorCategoria[canalSeleccionado.cat].length === 0) {
    delete canalesPorCategoria[canalSeleccionado.cat];
    ordenCategorias = ordenCategorias.filter(c => c !== canalSeleccionado.cat);
    categoriaSeleccionada = "__todas__";
    renderSelect();
  }
  cerrarModalOpciones();
  renderGrid();
  actualizarContador();
}

function opcionEditar() {
  if (!canalSeleccionado) return;
  const canal = canalesPorCategoria[canalSeleccionado.cat][canalSeleccionado.idx];

  document.getElementById("editNombre").value = canal.nombre;
  document.getElementById("editUrl").value = canal.url;
  document.getElementById("editLogo").value = canal.logo;
  actualizarPreviewLogo("editLogo", "previewImgEditar");
  
  const sel = document.getElementById("editCategoria");
  sel.innerHTML = "";
  Object.keys(canalesPorCategoria).forEach(c => {
    sel.innerHTML += `<option value="${c}" ${c === canalSeleccionado.cat ? 'selected' : ''}>${c}</option>`;
  });

  cerrarModalOpciones();
  document.getElementById("modalEditar").classList.remove("oculto");
}

function cerrarModalEditar() {
  document.getElementById("modalEditar").classList.add("oculto");
  canalSeleccionado = null;
}

function guardarEdicion() {
  if (!canalSeleccionado) return;
  
  const nombre = document.getElementById("editNombre").value.trim();
  const url = document.getElementById("editUrl").value.trim();
  const logo = document.getElementById("editLogo").value.trim() || LOGO_DEFAULT;
  const nuevaCat = document.getElementById("editCategoria").value;

  if (!nombre || !url) return alert("Nombre y URL son obligatorios.");

  const catVieja = canalSeleccionado.cat;
  const idx = canalSeleccionado.idx;

  if (catVieja === nuevaCat) {
    canalesPorCategoria[catVieja][idx] = { nombre, url, logo, categoria: nuevaCat };
  } else {
    canalesPorCategoria[catVieja].splice(idx, 1);
    if (canalesPorCategoria[catVieja].length === 0) {
      delete canalesPorCategoria[catVieja];
      ordenCategorias = ordenCategorias.filter(c => c !== catVieja);
      renderSelect();
    }
    canalesPorCategoria[nuevaCat].push({ nombre, url, logo, categoria: nuevaCat });
  }

  cerrarModalEditar();
  renderGrid();
  actualizarContador();
}

/* ============================================================
   REPRODUCTOR
   ============================================================ */
let plyrPlayer = null;
let hlsInstance = null;
let mpegtsInstance = null;

function inicializarPlyr() {
  if (plyrPlayer) return;
  plyrPlayer = new Plyr('#reproductorStream', { controls: ['play','progress','current-time','mute','volume','fullscreen'] });
}

function esStreamDirecto(url) {
  const u = (url || "").toLowerCase().split("?")[0];
  return u.endsWith(".m3u") || u.endsWith(".m3u8") || u.endsWith(".ts") || u.endsWith(".mp4") || u.endsWith(".mkv") || u.endsWith(".flv") || u.includes(".m3u8") || u.includes(".flv");
}

function opcionReproducir() {
  if (!canalSeleccionado) return;
  const canal = canalesPorCategoria[canalSeleccionado.cat][canalSeleccionado.idx];
  cerrarModalOpciones();
  
  if (esStreamDirecto(canal.url)) reproducirStream(canal.url, canal.nombre);
  else reproducirWeb(canal.url, canal.nombre);
}

function reproducirStream(url, nombre) {
  inicializarPlyr();
  document.getElementById("nombreCanalRep").textContent = nombre;
  document.getElementById("reproductorContenedor").classList.add("visible");
  document.getElementById("iframeContenedor").classList.remove("visible");

  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  if (mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }

  const mediaEl = plyrPlayer.media;
  const u = url.toLowerCase();

  if (u.includes(".flv")) {
    mpegtsInstance = mpegts.createPlayer({ type:'flv', isLive:true, url }, { enableWorker:true });
    mpegtsInstance.attachMediaElement(mediaEl);
    mpegtsInstance.load();
    mpegtsInstance.play().catch(()=>{});
  } else if (Hls.isSupported() && u.includes(".m3u8")) {
    hlsInstance = new Hls();
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(mediaEl);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => plyrPlayer.play().catch(()=>{}));
  } else {
    plyrPlayer.source = { type:'video', sources:[{ src:url }] };
    plyrPlayer.play().catch(()=>{});
  }
}

function cerrarReproductor() {
  document.getElementById("reproductorContenedor").classList.remove("visible");
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  if (mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }
  if (plyrPlayer) { plyrPlayer.pause(); plyrPlayer.media.removeAttribute('src'); plyrPlayer.media.load(); }
}

function reproducirWeb(url, nombre) {
  document.getElementById("nombreCanalIframe").textContent = nombre;
  const wrap = document.getElementById("iframeWrapper");
  wrap.innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  document.getElementById("iframeContenedor").classList.add("visible");
  document.getElementById("reproductorContenedor").classList.remove("visible");
}

function cerrarIframeReproductor() {
  document.getElementById("iframeContenedor").classList.remove("visible");
  document.getElementById("iframeWrapper").innerHTML = "";
}

  document.getElementById("btnActualizar").addEventListener("click", actualizarEnGitHub);

  document.getElementById("addLogo").addEventListener("input", () => {

  });
  document.getElementById("editLogo").addEventListener("input", () => {

  });
});
